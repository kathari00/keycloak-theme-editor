version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 (the native port) has no JavaScript compiler API, which typescript-eslint needs.
      # Drop this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: maven
    directory: /tools/preview-renderer
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      maven-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
